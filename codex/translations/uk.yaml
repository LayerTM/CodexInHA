configuration:
  api_key:
    name: Ключ API OpenAI
    description: >-
      Ваш ключ API OpenAI з platform.openai.com (починається на sk-).
      Використовуйте, якщо платите за API напряму. Залиште порожнім, якщо у вас
      план ChatGPT — тоді увійдіть інтерактивно командою 'codex login' у
      консолі.
  ha_token:
    name: Токен HA (Long-Lived Access Token)
    description: >-
      Довготривалий токен доступу Home Assistant. Створіть його в Home Assistant:
      Профіль → Безпека → Довготривалі токени доступу. Коли заданий, Codex може
      робити знімки дашбордів (ha-shot), користуватися hass-cli та інструментами
      hass-mcp і звертатися до Home Assistant по WebSocket/REST від вашого імені.
      Зберігається зашифрованим і переживає оновлення аддона. Залиште порожнім,
      щоб пропустити ці можливості.
  bypass_permissions:
    name: Пропускати запити підтверджень
    description: >-
      Коли ввімкнено, Codex НЕ питатиме підтвердження перед запуском
      shell-команд, редагуванням файлів чи іншими діями.
      Вмикайте, лише якщо повністю довіряєте рішенням Codex.
      Відповідає прапорцю --dangerously-bypass-approvals-and-sandbox.
      У будь-якому разі консоль працює без пісочниці — це ваша власна сесія,
      а межею навколо неї є контейнер аддона. Ця опція вирішує саме запити
      підтверджень. Prompt API — окремо: він завжди виконується в сесії Codex
      лише для читання, хоч би що тут стояло.
  auto_update:
    name: Автооновлення Codex
    description: >-
      Коли ввімкнено, Codex перевіряє та встановлює оновлення при кожному
      старті аддона. Вимкніть, якщо хочете зафіксувати конкретну версію.
      Оновити вручну завжди можна командою 'codex update' у терміналі.
  model:
    name: Перевизначення моделі
    description: >-
      Перевизначити модель Codex за замовчуванням. Залиште порожнім, щоб
      використати модель за замовчуванням Codex CLI.
  custom_instructions:
    name: Власні інструкції
    description: >-
      Додаткові інструкції, що додаються до вбудованого контексту Home Assistant
      (AGENTS.md). Використовуйте, щоб додати свої вподобання, стандарти коду чи
      контекст проєкту.
  environment_vars:
    name: Додаткові змінні середовища
    description: >-
      Додаткові змінні середовища, які передаються в Codex.
      Формат: KEY=VALUE — по одному запису на рядок.
      Приклад: MY_VAR=hello або NODE_OPTIONS=--max-old-space-size=4096
  init_commands:
    name: Команди ініціалізації
    description: >-
      Shell-команди, що виконуються під час старту аддона перед запуском
      Codex. Зручно для встановлення додаткових інструментів чи
      MCP-серверів. Приклади: 'npm install -g @openai/some-mcp-server'
      або 'apt-get install -y ffmpeg'
  plugins:
    name: Додаткові плагіни
    description: >-
      Додаткові плагіни Codex поверх вбудованого набору, по одному запису.
      Встановлюються один раз і зберігаються між оновленнями. Базовий набір
      (HA-скіли тощо) завжди присутній.
  marketplaces:
    name: Додаткові маркетплейси плагінів
    description: >-
      Додаткові маркетплейси плагінів для реєстрації, по одному на запис — GitHub
      'owner/repo', Git-URL або шлях. Потрібні перед встановленням плагінів з
      маркетплейсу, якого немає серед вбудованих.
  skills_git:
    name: Git-репозиторій власних скілів
    description: >-
      Необовʼязковий Git-репозиторій ваших власних скілів, що синхронізується в
      ~/.codex/skills при кожному старті. Кожна тека верхнього рівня в репо має
      бути одним скілом із файлом SKILL.md. Залиште порожнім, щоб пропустити.
  extra_args:
    name: Додаткові аргументи Codex
    description: >-
      Додаткові аргументи командного рядка до типового виклику 'codex'.
      По одному аргументу на запис (не обʼєднуйте кілька прапорців в одному рядку).
      Приклади: --resume, --model, gpt-5.1-codex, --verbose
  launch_command:
    name: Власна команда запуску
    description: >-
      Повна команда для запуску замість типового виклику 'codex'.
      Коли задана, вона повністю замінює типовий запуск — bypass_permissions і
      extra_args ігноруються. Використовуйте для складніших сценаріїв, як-от
      обгортання codex іншим інструментом чи запуск іншого бінарника.
      Приклад: codex --resume --dangerously-bypass-approvals-and-sandbox
      Залиште порожнім для типової поведінки запуску.
  upload_retention_days:
    name: Зберігання завантажених файлів (днів)
    description: >-
      Файли, прикріплені через веб-консоль, зберігаються в /data/uploads.
      Файли, старші за цю кількість днів, видаляються автоматично.
      Встановіть 0, щоб зберігати завантаження назавжди.
  remote_control:
    name: Віддалене керування (мобільний доступ Codex)
    description: >-
      Запускає окрему вкладку, щоб офіційний мобільний застосунок ChatGPT /
      chatgpt.com міг керувати сесією цієї машини. Потребує повного
      інтерактивного входу в терміналі ('codex login') — самого ключа API
      недостатньо.
  monitoring_interval_hours:
    name: Проактивний моніторинг (годин)
    description: >-
      Коли більше 0, Codex періодично (кожні N годин) переглядає журнал помилок
      і конфігурацію HA і надсилає сповіщення, лише якщо знаходить щось варте
      уваги. Потребує входу в Codex і витрачає ліміт плану на кожну перевірку.
      Встановіть 0, щоб вимкнути (типово). Щоб отримувати перевірки на телефон,
      задайте також HA_NOTIFY_SERVICE у змінних середовища.
  daily_digest_time:
    name: Час ранкового зведення (HH:MM)
    description: >-
      Коли задано час на кшталт 08:00 (у часовому поясі аддона), Codex раз на
      день надсилає коротке дружнє ранкове зведення — сьогоднішня погода плюс
      делікатне нагадування про варте уваги (світло, лишене на ніч, відчинені
      двері, низький заряд батарей). Потребує входу в Codex і витрачає трохи
      ліміту плану раз на день. Залиште порожнім, щоб вимкнути. Щоб отримувати на
      телефон, задайте також HA_NOTIFY_SERVICE у змінних середовища (інакше буде
      у сповіщеннях HA).
  proactive_alerts:
    name: Проактивні сповіщення (детерміновані)
    description: >-
      Коли ввімкнено, легкий фоновий цикл стежить за станами Home Assistant і
      сповіщає вас, щойно щось виглядає не так — протікання води, відчинені на
      ніч двері чи вікно, низький заряд батареї або температура поза межами.
      Повністю детерміновано (фіксовані правила, без Codex і без витрат ліміту
      плану) і сповіщає лише про НОВУ проблему, а не щоцикл. Типово вимкнено.
      Щоб отримувати на телефон, задайте також HA_NOTIFY_SERVICE у змінних
      середовища.
  proactive_alerts_interval_minutes:
    name: Інтервал перевірки сповіщень (хвилин)
    description: >-
      Як часто цикл проактивних сповіщень перевіряє дім, у хвилинах (типово 15).
      Менше значення — швидша реакція, але частіші перевірки.
  alert_battery_below:
    name: Поріг низького заряду (%)
    description: >-
      Сповіщати, коли будь-яка сутність-батарея падає нижче цього відсотка
      (типово 15). Встановіть 0, щоб вимкнути сповіщення про низький заряд.
  alert_water_leak:
    name: Сповіщення про протікання (критичні)
    description: >-
      Сповіщати, коли датчик протікання/вологи спрацьовує. Вважається
      КРИТИЧНИМ і надсилається завжди — навіть у тихі години. Типово ввімкнено.
  alert_open_at_night:
    name: Сповіщення «відчинено вночі»
    description: >-
      Сповіщати, коли двері, вікно чи гараж відчинені протягом нічного вікна
      нижче. Типово ввімкнено.
  alert_night_start:
    name: Початок нічного вікна (HH:MM)
    description: >-
      Початок нічного вікна для сповіщень «відчинено вночі» (типово 23:00).
  alert_night_end:
    name: Кінець нічного вікна (HH:MM)
    description: >-
      Кінець нічного вікна для сповіщень «відчинено вночі» (типово 06:00).
  alert_temp_enabled:
    name: Температурні сповіщення
    description: >-
      Сповіщати, коли датчик температури показує нижче нижньої або вище верхньої
      межі нижче. Типово вимкнено, бо розумні межі різняться для кожного датчика.
  alert_temp_low:
    name: Нижня межа температури (°)
    description: >-
      Сповіщати, коли ввімкнений датчик температури показує нижче цього значення
      (типово 5). Використовується лише коли увімкнено температурні сповіщення.
  alert_temp_high:
    name: Верхня межа температури (°)
    description: >-
      Сповіщати, коли ввімкнений датчик температури показує вище цього значення
      (типово 45). Використовується лише коли увімкнено температурні сповіщення.
  alert_quiet_hours:
    name: Тихі години сповіщень (HH:MM-HH:MM)
    description: >-
      Протягом цього вікна некритичні сповіщення (батарея, температура,
      відчинено вночі) притримуються; критичні сповіщення про протікання
      надсилаються завжди. Формат на кшталт 22:00-07:00. Залиште порожнім, щоб
      вимкнути тихі години (типово).
  prompt_api:
    name: Prompt API (інтеграція AI Agent)
    description: >-
      Обслуговує захищений prompt API на внутрішньому порту для
      компаньйон-інтеграції Home Assistant — спілкування з Codex через
      Assist і сенсор стану. Порт доступний лише всередині внутрішньої мережі
      Home Assistant, кожен запит потребує bearer-токена, а кожен промпт
      виконується в ізольованій сесії Codex лише для читання. Вимкніть,
      якщо не користуєтеся інтеграцією.
  api_token:
    name: Токен Prompt API (необовʼязково)
    description: >-
      Bearer-токен, який компаньйон-інтеграція має пред'являти prompt API.
      Залиште порожнім (рекомендовано): аддон сам згенерує надійний токен і
      передасть його інтеграції через Supervisor discovery — без ручного
      налаштування. Задавайте, лише якщо хочете фіксований відомий токен як
      ручний резервний варіант.
  prompt_ha_token:
    name: HA-токен для Prompt API (необовʼязково, обмежений користувач)
    description: >-
      Довготривалий токен доступу Home Assistant, який використовують ЛИШЕ сесії
      prompt API для читання стану Home Assistant через інтеграцію Model Context
      Protocol Server. Найкраще: створіть окремого не-адмін користувача Home
      Assistant і вставте його токен сюди. Залиште порожнім, щоб використати
      'Токен HA'. У будь-якому разі Codex бачить лише сутності, відкриті для
      Assist.
  chat_model:
    name: Модель чату (інтеграція AI Agent)
    description: >-
      Необовʼязкове перевизначення моделі ЛИШЕ для компаньйон-чату (інтеграція
      AI Agent), окремо від консолі. Вкажіть швидшу й дешевшу модель для
      миттєвих недорогих відповідей в Assist, поки консоль лишається на своїй
      моделі. Залиште порожнім, щоб узяти «Перевизначення моделі» вище або
      модель Codex за замовчуванням.
  chat_model_voice:
    name: Модель для голосу (інтеграція AI Agent)
    description: >-
      Необовʼязкова ще швидша модель ЛИШЕ для голосових турнів Assist — голосові
      відповіді короткі, тож менша затримка важливіша за потужність. Залиште
      порожнім, щоб для голосу теж бралася «Модель чату» вище.
  chat_model_write:
    name: Модель для дій (інтеграція AI Agent)
    description: >-
      Необовʼязкова модель для виконання дії, яку ви вже підтвердили в чаті. Цей
      крок лише викликає задану дію Home Assistant, тож зазвичай вистачає швидшої
      й дешевшої моделі. Залиште порожнім, щоб бралася «Модель чату» вище. Голосовий
      турн лишається на «Моделі для голосу», якщо її задано.
  chat_model_camera:
    name: Модель для камер (інтеграція AI Agent)
    description: >-
      Необовʼязкова модель для запитань, на які відповідають за знімком камери.
      Залиште порожнім, щоб бралася «Модель чату» вище. Голосовий турн лишається на
      «Моделі для голосу», якщо її задано.
