name: Dependabot auto-merge

# Automatically merges Dependabot pull requests for non-major updates once all
# required status checks pass. Major version bumps are left for manual review.
#
# Runs on the pull_request event. For pull requests opened by Dependabot the
# workflow token is read-only unless the workflow asks for more, so the
# permissions block below is what lets the job enable auto-merge. This job
# never checks out or executes the PR's code — it only reads Dependabot's
# metadata and enables auto-merge, which then waits for the branch-protection
# required checks before merging.
#
# On this event the workflow definition comes from the pull request's merge
# commit, so a Dependabot bump of this very file would run its new action pins
# with the write token before anyone reviews them. The first step therefore
# stops the job, using no action, when the file is among the changed files or
# the list cannot be read, and labels the pull request for human review.
#
# A merge made with the workflow token raises no push event, so once the pull
# request has merged this job starts the main-measured workflow, which runs CI
# for the head of main unless it already has a run. That workflow also has a
# schedule, but GitHub does not guarantee scheduled runs, so this dispatch is
# what measures a bot merge.

on: pull_request

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Stop when this workflow is edited
        id: guard
        # A run step only: nothing from the pull request is executed before it.
        # Fail closed: an unreadable file list is treated as a self-edit.
        run: |
          if files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" \
            && ! printf '%s\n' "$files" | grep -qxF '.github/workflows/dependabot-auto-merge.yml'; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "safe=false" >> "$GITHUB_OUTPUT"
          gh label create "needs review" --repo "$REPO" --color d93f0b \
            --description "Needs a human review before merging" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label "needs review" || true
          echo "::notice::this pull request changes the auto-merge workflow, or its changed files could not be read; it is left for manual review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: metadata
        if: ${{ steps.guard.outputs.safe == 'true' }}
        # Pinned to an immutable commit SHA (this job runs with write scope). The version comment lets Dependabot's
        # github-actions updater keep the pin current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for known minor/patch updates
        id: enable
        # Fail-closed allowlist: only explicitly-recognized minor/patch updates
        # auto-merge. Majors — and any PR whose update-type can't be determined —
        # fall through to manual review instead of merging by default.
        if: ${{ steps.guard.outputs.safe == 'true' && contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure main once the pull request has merged
        if: ${{ steps.enable.conclusion == 'success' }}
        run: |
          answered=0
          for _ in $(seq 1 80); do
            # A failed call counts as "not merged yet"; the next poll retries it.
            state="$(gh pr view "$PR_URL" --json state --jq .state)" || state=""
            [ -n "$state" ] && answered=1
            case "$state" in
              MERGED)
                gh workflow run main-measured.yml --repo "$REPO" --ref main
                echo "::notice::merged; main-measured dispatched"
                exit 0 ;;
              CLOSED)
                echo "closed without a merge"
                exit 0 ;;
            esac
            sleep 30
          done
          if [ "$answered" = 0 ]; then
            echo "::error::the pull request state could not be read"
            exit 1
          fi
          echo "::warning::not merged within 40 minutes; main is not measured for this merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
