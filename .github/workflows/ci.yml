name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A dispatched run measures the branch as it is. cut_release is the one thing
  # that also cuts a release from this trigger: release-cadence.yml sets it,
  # once a day or on an explicit dispatch, so a plain re-run of CI never ships
  # one.
  workflow_dispatch:
    inputs:
      cut_release:
        description: Cut a release for main's current version if one is pending
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The tests run against the tree the image ships: this repository's files
  # merged with the pinned ha-agent-core release, by the same script the image
  # build uses. A test therefore sees the adapter exactly as the core loads it.
  #
  # Tests and the linters are two jobs, and their names are the ones main's
  # branch protection requires: a job's name IS the check a pull request is
  # gated on, so renaming one takes a gate away from every later pull request,
  # not just this one.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          codex/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" codex "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Run tests
        working-directory: ${{ runner.temp }}/addon/app
        run: npm test

  # The command the pull-request template asks a contributor to run, run exactly
  # as it is written there. A test that quietly grows a dependency on the
  # assembled tree would still pass the job above and leave that line a lie.
  # A test that needs the core declares it by living in `test/assembled/`, which
  # this command does not reach and the job above does.
  tests-bare:
    name: Tests in a plain checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The add-on's own tests, with nothing installed
        working-directory: codex/app
        run: node --test test/*.test.js

  lint-js:
    name: JS lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          codex/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" codex "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Lint (eslint)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run typecheck
      # The add-on's Node executables live in rootfs/, outside app/, so the
      # console's own config never sees them. They are linted here, from the
      # assembled tree where app/ and rootfs/ sit side by side, against the
      # files the interpreter check names rather than a list written by hand.
      - name: Lint the Node executables
        working-directory: ${{ runner.temp }}/addon
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/lint_targets.py" \
            --repo "${GITHUB_WORKSPACE}" --list node --root codex > "${RUNNER_TEMP}/node-targets"
          # --max-warnings=0: a file ESLint has no configuration for is only a
          # warning and would otherwise pass (measured on ESLint 9).
          xargs -a "${RUNNER_TEMP}/node-targets" ./app/node_modules/.bin/eslint --max-warnings=0

  # Every executable this repository ships is taken by one of the linters below,
  # decided by its interpreter. A script that belongs to none fails this job:
  # that is how an executable rewritten from one language into another stops
  # being checked by anything while every other job stays green.
  lint-coverage:
    name: Every script has a linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the interpreter check
        working-directory: .github/scripts
        run: python test_lint_targets.py
      - name: Every executable script has a linter
        run: python .github/scripts/lint_targets.py

  # A user does not install the add-on file by file: they paste this repository's
  # URL into the add-on store, and the store decides whether the clone is a store
  # at all before reading anything of ours. Nothing else here looks at the root —
  # every linter below is handed the add-on directory.
  store-repository:
    name: Add-on store repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader the Supervisor uses
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_store_repository_check.py
      - name: This repository is a valid add-on store
        run: python .github/scripts/store_repository_check.py .

  # The Configuration tab is generated from the option schema and labelled from
  # the translations. An option no language names is shown to the user as its raw
  # key — visible to everyone who configures the add-on, and to no check until now.
  translations:
    name: Every option is explained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_translations_check.py
      - name: Every option is named and described in every language
        run: python .github/scripts/translations_check.py codex

  addon-linter:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./codex"

  hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: codex/Dockerfile
          ignore: DL3003,DL3008,DL3013,DL3018,DL3059,SC2015

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Check every shell executable
        run: |
          python3 .github/scripts/lint_targets.py --list shell > "${RUNNER_TEMP}/shell-targets"
          xargs -a "${RUNNER_TEMP}/shell-targets" shellcheck --severity=warning

  python-lint:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the checker
        run: pip install --disable-pip-version-check pyflakes==3.4.0
      - name: Check every Python executable and script
        run: |
          python .github/scripts/lint_targets.py --list python > "${RUNNER_TEMP}/python-targets"
          # The repository's own scanners are imported, not executed, so they
          # are not executable and the interpreter check does not name them.
          git ls-files '*.py' >> "${RUNNER_TEMP}/python-targets"
          sort -u "${RUNNER_TEMP}/python-targets" | xargs pyflakes

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_secret_scan.py
      - name: Scan tracked files for secrets and personal data
        run: python .github/scripts/secret_scan.py .

  # A repository is copied onto machines nothing like the one it was written on.
  # An absolute home or temporary path, a symlink pointing outside the clone, a
  # link to an authoring transcript or an attribution trailer left in a tracked
  # file all work on exactly one computer and are dead everywhere else.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the scanner
        run: python test_hygiene_scan.py
        working-directory: .github/scripts
      - name: Scan tracked files for traces of one machine
        run: python .github/scripts/hygiene_scan.py .

  # What a release is allowed to depend on is a list, and a list goes stale the
  # first time a gate is added without touching it. This asserts the release job
  # waits for every other job in this file — on the pull request that adds one,
  # rather than on main after a release has already been cut past it.
  workflow-gates:
    name: Workflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_ci_gates.py
      - name: Every gate is a gate the release waits for
        run: python .github/scripts/ci_gates.py

  # What a release's notes carry is decided by a script, so it can be tested.
  # This job always runs, so the release below may need it.
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the script that composes a release's notes
        working-directory: .github/scripts
        run: python test_release_notes.py

  # A release exists only for a commit that passed every gate above on this very
  # run. It is not cut from the push that lands a bump: release-cadence.yml
  # dispatches this workflow with cut_release once a day, or a maintainer does it
  # by hand for a fix that cannot wait — the owner's rule is at most one release
  # a day, and this is the mechanism that holds it rather than a person's memory.
  # A version bumped and superseded before its own cut is not lost: notes.md
  # carries every changelog section back to the last real release.
  release:
    name: Release
    needs:
      - tests
      - tests-bare
      - lint-js
      - lint-coverage
      - store-repository
      - translations
      - addon-linter
      - hadolint
      - shellcheck
      - python-lint
      - secret-scan
      - hygiene
      - workflow-gates
      - release-notes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.cut_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve version from config.yaml
        id: v
        run: |
          version="$(python .github/scripts/release_notes.py version codex/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — nothing to do."
            exit 0
          fi
          python .github/scripts/release_notes.py notes codex/config.yaml \
            codex/CHANGELOG.md --write notes.md
          gh release create "${tag}" \
            --title "Codex for Home Assistant ${VERSION}" \
            --notes-file notes.md \
            --target "${SHA}"
          echo "Created release ${tag}."
