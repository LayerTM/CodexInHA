name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A dispatched run measures the branch as it is. cut_release is the one thing
  # that also cuts a release from this trigger: release-cadence.yml sets it,
  # once a day or on an explicit dispatch, so a plain re-run of CI never ships
  # one.
  workflow_dispatch:
    inputs:
      cut_release:
        description: Cut a release for main's current version if one is pending
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The tests run against the tree the image ships: this repository's files
  # merged with the pinned ha-agent-core release, by the same script the image
  # build uses. A test therefore sees the adapter exactly as the core loads it.
  #
  # Tests and the linters are two jobs, and their names are the ones main's
  # branch protection requires: a job's name IS the check a pull request is
  # gated on, so renaming one takes a gate away from every later pull request,
  # not just this one.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          codex/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" codex "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Run tests
        working-directory: ${{ runner.temp }}/addon/app
        run: npm test

  # The command the pull-request template asks a contributor to run, run exactly
  # as it is written there. A test that quietly grows a dependency on the
  # assembled tree would still pass the job above and leave that line a lie.
  # A test that needs the core declares it by living in `test/assembled/`, which
  # this command does not reach and the job above does.
  tests-bare:
    name: Tests in a plain checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The add-on's own tests, with nothing installed
        working-directory: codex/app
        run: node --test test/*.test.js

  lint-js:
    name: JS lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          codex/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" codex "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Lint (eslint)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run typecheck
      # The add-on's Node executables live in rootfs/, outside app/, so the
      # console's own config never sees them. They are linted here, from the
      # assembled tree where app/ and rootfs/ sit side by side, against the
      # files the interpreter check names rather than a list written by hand.
      - name: Lint the Node executables
        working-directory: ${{ runner.temp }}/addon
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/lint_targets.py" \
            --repo "${GITHUB_WORKSPACE}" --list node --root codex > "${RUNNER_TEMP}/node-targets"
          # --max-warnings=0: a file ESLint has no configuration for is only a
          # warning and would otherwise pass (measured on ESLint 9).
          xargs -a "${RUNNER_TEMP}/node-targets" ./app/node_modules/.bin/eslint --max-warnings=0

  # Every executable this repository ships is taken by one of the linters below,
  # decided by its interpreter. A script that belongs to none fails this job:
  # that is how an executable rewritten from one language into another stops
  # being checked by anything while every other job stays green.
  lint-coverage:
    name: Every script has a linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the interpreter check
        working-directory: .github/scripts
        run: python test_lint_targets.py
      - name: Every executable script has a linter
        run: python .github/scripts/lint_targets.py

  # A user does not install the add-on file by file: they paste this repository's
  # URL into the add-on store, and the store decides whether the clone is a store
  # at all before reading anything of ours. Nothing else here looks at the root —
  # every linter below is handed the add-on directory.
  store-repository:
    name: Add-on store repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader the Supervisor uses
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_store_repository_check.py
      - name: This repository is a valid add-on store
        run: python .github/scripts/store_repository_check.py .

  # The Configuration tab is generated from the option schema and labelled from
  # the translations. An option no language names is shown to the user as its raw
  # key — visible to everyone who configures the add-on, and to no check until now.
  translations:
    name: Every option is explained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_translations_check.py
      - name: Every option is named and described in every language
        run: python .github/scripts/translations_check.py codex

  addon-linter:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./codex"

  hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: codex/Dockerfile
          ignore: DL3003,DL3008,DL3013,DL3018,DL3059,SC2015

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Check every shell executable
        run: |
          python3 .github/scripts/lint_targets.py --list shell > "${RUNNER_TEMP}/shell-targets"
          xargs -a "${RUNNER_TEMP}/shell-targets" shellcheck --severity=warning

  python-lint:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the checker
        run: pip install --disable-pip-version-check pyflakes==3.4.0
      - name: Check every Python executable and script
        run: |
          python .github/scripts/lint_targets.py --list python > "${RUNNER_TEMP}/python-targets"
          # The repository's own scanners are imported, not executed, so they
          # are not executable and the interpreter check does not name them.
          git ls-files '*.py' >> "${RUNNER_TEMP}/python-targets"
          sort -u "${RUNNER_TEMP}/python-targets" | xargs pyflakes

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_secret_scan.py
      - name: Scan tracked files for secrets and personal data
        run: python .github/scripts/secret_scan.py .

  # A repository is copied onto machines nothing like the one it was written on.
  # An absolute home or temporary path, a symlink pointing outside the clone, a
  # link to an authoring transcript or an attribution trailer left in a tracked
  # file all work on exactly one computer and are dead everywhere else.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the scanner
        run: python test_hygiene_scan.py
        working-directory: .github/scripts
      - name: Scan tracked files for traces of one machine
        run: python .github/scripts/hygiene_scan.py .

  # What a release is allowed to depend on is a list, and a list goes stale the
  # first time a gate is added without touching it. This asserts the release job
  # waits for every other job in this file — on the pull request that adds one,
  # rather than on main after a release has already been cut past it.
  workflow-gates:
    name: Workflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the YAML reader
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Self-test the check
        working-directory: .github/scripts
        run: python test_ci_gates.py
      - name: Every gate is a gate the release waits for
        run: python .github/scripts/ci_gates.py

  # Where every upstream pin comes from is declared beside it (see pins.py).
  # Always runs, so the release can need it; it only asks the upstreams when this
  # commit carries a version that has no release yet, i.e. on the pull request
  # that bumps the version and on any run that would cut it. A release therefore
  # never ships a pin that is behind, and an upstream that cannot be read fails it.
  #
  # A pin behind its upstream fails a pull request. On main it does not fail the
  # commit, which passed before the upstream published: the run records drift,
  # the release waits for it, and pins-bump opens the pull request that moves
  # the pins (pins_drift.py). An upstream that cannot be read fails everywhere.
  pins:
    name: Upstream pins
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test the script that reads the pins
        run: python .github/scripts/test_pins.py
      - name: Test the script that decides what a pin behind its upstream means
        run: python .github/scripts/test_pins_drift.py
      # The add-on store offers config.yaml's version from main the moment a
      # pull request merges, released or not, so the version moves only in the
      # pull request that releases it ("Release X.Y.Z"). The title comes from the
      # event that started the run: a pull request retitled afterwards is checked
      # again by its next push, or by closing and reopening it.
      - name: The version moves only in its release pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is shallow; fetch the base commit only when it is missing.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi
          base="${RUNNER_TEMP}/base-config.yaml"
          # A base without the file has no version: adding it is a move.
          if ! git show "${BASE_SHA}:codex/config.yaml" > "${base}"; then rm -f "${base}"; fi
          python .github/scripts/release_notes.py version-move "${base}" codex/config.yaml "${TITLE}"
      - name: Does this commit carry an unreleased version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python .github/scripts/release_notes.py version codex/config.yaml)"
          # 0 released, 1 none, 2 gh could not say. This job only ever adds a
          # check, so when gh cannot say it takes the stricter reading, out
          # loud: pins are compared as if the version were unreleased.
          status=0
          python .github/scripts/release_notes.py released "${version}" || status=$?
          case "${status}" in
            0)
              echo "v${version} is already released; the pins are checked when the version moves."
              echo "unreleased=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "v${version} has no release yet; every pin must match its upstream."
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::could not tell whether v${version} is released; checking every pin as if it were not"
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Every pin matches its upstream
        id: check
        if: steps.release.outputs.unreleased == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Drift is what the check printed as "behind", not its exit status
          # alone: a crash exits 1 too.
          set -o pipefail
          status=0
          python .github/scripts/pins.py check | tee "${RUNNER_TEMP}/pins-check.txt" || status=$?
          python .github/scripts/pins_drift.py verdict "${status}" "${RUNNER_TEMP}/pins-check.txt"

  # The pull request for drift that main recorded: one branch, pins/bump, kept
  # at exactly what `pins.py bump` writes on top of main, and CI started on it
  # (a pull request opened with the workflow token raises no event of its own).
  # Its content is this repository's own script run on main's own tree. It runs
  # on every run so that the release can wait for it; only drift gives it work.
  pins-bump:
    name: Upstream pins bump
    needs: pins
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    # No concurrency group: a queued run would be cancelled, not green. Two runs
    # of main writing the branch at once are settled by the push itself (a
    # lease on what was read, read again when it moved), and a run of an older
    # main never rewinds a branch built on a newer one.
    steps:
      - name: Nothing to move
        if: needs.pins.outputs.drift != 'true'
        run: echo "No pin is behind on this run."
      - uses: actions/checkout@v7
        if: needs.pins.outputs.drift == 'true'
        with:
          # Which commits on the branch are not main's is a question about
          # history; a shallow clone would count main's own as a person's.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: needs.pins.outputs.drift == 'true'
        with:
          python-version: "3.14"
      # pins.py bump refreshes package-lock.json files with npm.
      - uses: actions/setup-node@v7
        if: needs.pins.outputs.drift == 'true'
        with:
          node-version: "26"
      - name: Open or update the bump pull request
        if: needs.pins.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pins_drift.py open-pr

  # The architectures come from the add-on's own files rather than being listed
  # here, so adding one cannot leave it unbuilt — and the script refuses to answer
  # when config.yaml and build.yaml disagree about the set.
  arches:
    name: Architectures
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test the script the matrix comes from
        run: python .github/scripts/test_addon_arches.py
      - name: Read the architectures the add-on declares
        id: read
        run: |
          list="$(python .github/scripts/addon_arches.py)"
          echo "Declared architectures: ${list}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"

  # The add-on is built on the ha-agent-core release its lock pins. A pin is
  # merged only once that release exists and publishes this very lock, and a
  # version once pinned keeps its URL, commit and digest.
  core-release:
    name: Pinned core is released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The lock is well formed and keeps what main pinned
        run: |
          lock=codex/core/core.lock.json
          previous=()
          if git show origin/main:"${lock}" > "${RUNNER_TEMP}/previous.lock.json" 2>/dev/null; then
            previous=(--previous-lock "${RUNNER_TEMP}/previous.lock.json")
          fi
          node codex/core/verify-core.js check --lock "${lock}" \
            --adapter-api "$(node -p 'require(process.argv[1]).adapterApi' "${PWD}/${lock}")" "${previous[@]}"
      - name: The pinned version is published with this lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock=codex/core/core.lock.json
          version="$(node -p 'require(process.argv[1]).version' "${PWD}/${lock}")"
          if ! gh release download "v${version}" --repo LayerTM/ha-agent-core \
               --pattern core.lock.json --dir "${RUNNER_TEMP}/published"; then
            echo "ha-agent-core v${version} is not released; this pin cannot be merged yet."
            exit 1
          fi
          node -e 'require("node:assert").deepStrictEqual(require(process.argv[1]), require(process.argv[2]))' \
            "${PWD}/${lock}" "${RUNNER_TEMP}/published/core.lock.json"
          echo "ha-agent-core v${version} is published with this lock."

  # A broken Dockerfile used to be invisible until a user's own update rebuilt
  # the image on their device. This builds it for every declared architecture,
  # natively, and publishes nothing.
  image:
    name: Add-on image (${{ matrix.arch }})
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.list) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Resolve the platform and base image for ${{ matrix.arch }}
        id: target
        run: |
          case "${{ matrix.arch }}" in
            amd64)   platform=linux/amd64 ;;
            aarch64) platform=linux/arm64 ;;
            *)
              echo "No Docker platform is mapped for '${{ matrix.arch }}'."
              echo "It is declared in the add-on but this job does not know how"
              echo "to build it — add the mapping here rather than dropping it."
              exit 1
              ;;
          esac
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "from=$(python .github/scripts/addon_arches.py --build-from '${{ matrix.arch }}')" >> "$GITHUB_OUTPUT"
      - name: Refuse to pass by emulating the target
        run: |
          # Building arm64 under QEMU would still go green while taking half an
          # hour and exercising a different code path than users get. If the
          # native runner is unavailable this must fail loudly, not quietly
          # emulate: the point of the job is to build what ships.
          want='${{ steps.target.outputs.platform }}'
          have="linux/$(dpkg --print-architecture)"
          if [ "${want}" != "${have}" ]; then
            echo "This runner is ${have} but the job must build ${want}."
            echo "Give this architecture a runner that matches it."
            exit 1
          fi
      - name: Fetch the pinned core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="$(.github/scripts/core_archive.sh "${RUNNER_TEMP}/core")"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
      - name: Build the add-on image (no push)
        run: |
          # Once the pinned core is released the image fetches it itself, as it
          # does on a user's device; before that, the packed archive stands in
          # for the download and is still checked against the lock.
          archive=()
          if [ '${{ steps.core.outputs.source }}' = packed ]; then
            archive=(--build-context "core-archive=${RUNNER_TEMP}/core")
          fi
          docker build --pull \
            "${archive[@]}" \
            --platform '${{ steps.target.outputs.platform }}' \
            --build-arg BUILD_FROM='${{ steps.target.outputs.from }}' \
            --tag 'addon-image:${{ matrix.arch }}' \
            codex
      - name: Check the image runs what it shipped
        run: |
          # A build that succeeds and produces a binary that cannot execute on
          # this architecture is the exact failure a user would hit, so ask the
          # image, not the builder.
          docker run --rm --network none --platform '${{ steps.target.outputs.platform }}' \
            --entrypoint /opt/codex-npm/bin/codex 'addon-image:${{ matrix.arch }}' --version
          docker run --rm --network none --platform '${{ steps.target.outputs.platform }}' \
            --entrypoint /usr/local/bin/node 'addon-image:${{ matrix.arch }}' \
            -e "require('/opt/agent-console/node_modules/node-pty').spawn('/bin/true', [], {}).onExit(({ exitCode }) => { console.log('node-pty spawns, exit ' + exitCode); process.exit(exitCode); })"
      - name: The bundled CLI parses every argument list the prompt runner builds
        run: |
          # The lists come from the core and the adapter inside the image, not
          # from a copy, so a CLI bump that drops or renames a flag or a feature
          # fails here instead of turning every chat request into an error.
          docker run --rm --network none --platform '${{ steps.target.outputs.platform }}' \
            --volume "${PWD}/.github/scripts:/ci:ro" \
            --entrypoint /usr/local/bin/node 'addon-image:${{ matrix.arch }}' \
            /ci/runner_args_smoke.js /opt/codex-npm/bin/codex /opt/agent-console
      - name: Start-up, launch and update behave as recorded
        run: |
          # The service script, the Codex tab launcher and both update paths,
          # run inside the image against a recording stand-in for the CLI. What
          # they set up and call is pinned so that moving this code elsewhere
          # can be checked against it.
          docker run --rm --network none --platform '${{ steps.target.outputs.platform }}' \
            --volume "${PWD}/codex/app/test/image:/pins-src:ro" \
            --entrypoint bash 'addon-image:${{ matrix.arch }}' /pins-src/behaviour-pins.sh

  # What a release's notes carry is decided by a script, so it can be tested.
  # This job always runs, so the release below may need it.
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self-test the script that composes a release's notes
        working-directory: .github/scripts
        run: python test_release_notes.py

  # A release exists only for a commit that passed every gate above on this very
  # run. It is not cut from the push that lands a bump: release-cadence.yml
  # dispatches this workflow with cut_release once a day, or a maintainer does it
  # by hand for a fix that cannot wait — the owner's rule is at most one release
  # a day, and this is the mechanism that holds it rather than a person's memory.
  # A version bumped and superseded before its own cut is not lost: notes.md
  # carries every changelog section back to the last real release.
  release:
    name: Release
    needs:
      - tests
      - tests-bare
      - lint-js
      - lint-coverage
      - store-repository
      - translations
      - addon-linter
      - hadolint
      - shellcheck
      - python-lint
      - secret-scan
      - hygiene
      - workflow-gates
      - pins
      - pins-bump
      - arches
      - core-release
      - image
      - release-notes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.cut_release == true &&
      needs.pins.outputs.drift != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve version from config.yaml
        id: v
        run: |
          version="$(python .github/scripts/release_notes.py version codex/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          # 0 released, 1 none, 2 gh could not say — which must stop the job,
          # not be taken for "none" and cut a release nobody checked.
          status=0
          python .github/scripts/release_notes.py released "${VERSION}" || status=$?
          case "${status}" in
            0)
              echo "Release ${tag} already exists — nothing to do."
              exit 0
              ;;
            1) ;;
            *) exit "${status}" ;;
          esac
          python .github/scripts/release_notes.py notes codex/config.yaml \
            codex/CHANGELOG.md --write notes.md
          gh release create "${tag}" \
            --title "Codex for Home Assistant ${VERSION}" \
            --notes-file notes.md \
            --target "${SHA}"
          echo "Created release ${tag}."
